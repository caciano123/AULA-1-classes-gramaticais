.rv{opacity:0;filter:drop-shadow(3px 4px 0 rgba(20,33,61,.3))}.rv.on{opacity:1;animation:drop .5s steps(6,end) both}@keyframes drop{from{transform:translateY(-34px) rotate(-2.5deg)}to{transform:none}}

.side{display:flex;flex-direction:column;gap:12px}.ex .in{background:var(--paper);padding:10px 14px}.ex q{display:block;font-size:23px;font-weight:700;quotes:none}.ex small{display:block;font-size:15px;color:#33415f;margin-top:6px;line-height:1.3}
mark{background:none;color:var(--red);font-weight:900}.att .in{background:var(--yel);padding:9px 13px;font-size:16px;line-height:1.3;color:var(--navy);font-weight:600}

.tr.th{display:grid;grid-template-columns:2.4fr 2.2fr 3fr;gap:12px;padding:0 12px;height:24px;font:700 13px system-ui;color:#5b6784;text-transform:uppercase;align-items:center;filter:none;opacity:1}
.chip{position:absolute;box-sizing:border-box;border:3px solid;border-radius:6px;background:var(--paper);padding:5px 12px;height:50px;filter:drop-shadow(3px 4px 0 rgba(20,33,61,.3))}.chip b{display:block;font:900 20px var(--cond);text-transform:uppercase;color:var(--navy)}.chip small{display:block;font-size:13px;color:#33415f;opacity:0}
.cl2{position:absolute;font:900 24px var(--cond);text-transform:uppercase;color:var(--navy)}.bar2{position:absolute;bottom:72px;width:130px}.bv{position:absolute;font:900 46px var(--cond);color:var(--navy);width:130px;text-align:center}.ax{position:absolute;left:700px;width:470px;height:4px;bottom:70px;background:var(--navy)}
.kin{position:absolute;left:32px;top:30px;width:680px}.ln{display:block;width:max-content;margin:0 0 12px;font:900 86px/1 var(--cond);text-transform:uppercase;color:var(--navy)}.ln .in{background:var(--yel);padding:2px 18px}
.dm{position:absolute;left:730px;width:480px}.dm .in{background:var(--paper);padding:14px 18px;font-size:29px;font-weight:700;border-left:7px solid var(--red)}.cx{position:absolute;left:730px;width:250px;font:900 32px var(--cond);letter-spacing:1px}.cx .in{background:var(--red);color:var(--cream);padding:4px 14px;text-align:center}.cx.n .in{background:var(--navy)}
#ov{position:absolute;inset:0;background:rgba(20,33,61,.97);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;text-align:center}#ov h1{font:900 66px var(--cond);text-transform:uppercase;margin:0;color:var(--yel)}#ov p{color:#cfd6e6;font-size:20px;margin:0}#ov button{font:900 28px var(--cond);letter-spacing:1px;padding:14px 38px;border:0;border-radius:6px;background:var(--yel);color:var(--navy);cursor:pointer}

<div id="ov"><h1>As 10 classes gramaticais</h1><p>Aula 1 · Língua Portuguesa · Prof. Caciano Soares Costa</p><p>Videoaula animada em estilo documental, com narração e score. Ative o som do dispositivo.</p><button id="go">▶ Iniciar aula</button></div></div>
<script>
const D=[{"type": "hook", "h": "Por que a mesma palavra muda de classe?", "num": "", "c": "#B8312A", "t": "Por que a mesma palavra pode mudar de classe? Veja: em «O estudo é importante», estudo é substantivo, porque aceita o artigo o. Em «Eu estudo todas as noites», estudo é verbo, foi conjugado na primeira pessoa do singular. A classe depende do uso."}, {"type": "std", "h": "Abertura", "num": "", "c": "#7aa2ff", "d": "Aula 1 · Língua Portuguesa: as 10 classes gramaticais", "cards": [["nomeiam", "casa, saudade"], ["qualificam", "bonita, cansado"], ["indicam ações", "correr, nascer"], ["apenas ligam partes da frase", "e, de, porque"]], "ex": [], "att": "A classe depende do uso. Nunca classifique uma palavra solta: classifique-a na frase em que ela aparece.", "t": "Olá! Esta é a Aula 1 de Língua Portuguesa: as dez classes gramaticais, material elaborado pelo professor Caciano Soares Costa. Quando falamos ou escrevemos, as palavras não fazem todas a mesma coisa: algumas nomeiam, como casa e saudade; outras qualificam, como bonita e cansado; outras indicam ações, como correr e nascer; outras apenas ligam partes da frase, como e, de e porque. Neste vídeo, você vai ver cada classe, com conceito, classificações, exemplos explicados e frases analisadas. No final, resolvemos alguns exercícios. E guarde este alerta do material: a classe depende do uso. Nunca classifique uma palavra solta; classifique-a na frase em que ela aparece."}, {"type": "std", "h": "O que são classes gramaticais?", "num": "", "c": "#7aa2ff", "d": "São os grupos em que a gramática organiza as palavras de acordo com seu comportamento: a forma, a função e o sentido.", "cards": [["Critério morfológico (a forma)", "a palavra varia? Ex.: menino → meninos, meninas (varia); sempre (não varia)"], ["Critério sintático (a função)", "o que a palavra faz na frase? Ex.: núcleo do sujeito, modificador de um nome, ligação entre termos"], ["Critério semântico (o sentido)", "o que a palavra significa? Ex.: nome de ser, qualidade, ação, circunstância, emoção"]], "ex": [["«O *estudo* é importante» / «Eu *estudo* todas as noites»", "estudo = substantivo (aceita artigo o); estudo = verbo (conjugado na 1.ª pessoa do singular)."]], "att": "Nunca classifique uma palavra solta.", "t": "A Nomenclatura Gramatical Brasileira reconhece dez classes: substantivo, artigo, adjetivo, numeral, pronome, verbo, advérbio, preposição, conjunção e interjeição. Elas são os grupos em que a gramática organiza as palavras de acordo com seu comportamento: a forma, a função e o sentido. São três critérios. O critério morfológico olha a forma: a palavra varia? Menino vira meninos, meninas, ela varia; sempre não varia. O critério sintático olha a função: o que a palavra faz na frase, por exemplo, núcleo do sujeito, modificador de um nome, ligação entre termos. E o critério semântico olha o sentido: nome de ser, qualidade, ação, circunstância, emoção. Veja: em «O estudo é importante», estudo é substantivo, porque aceita o artigo o. Em «Eu estudo todas as noites», estudo é verbo, foi conjugado na primeira pessoa do singular. Por isso, nunca classifique uma palavra solta."}, {"type": "chart", "h": "Variáveis e invariáveis", "num": "", "c": "#7aa2ff", "t": "Seis classes são variáveis, isto é, sofrem flexão: substantivo, com gênero, número e grau; artigo, com gênero e número; adjetivo, com gênero, número e grau; numeral, com gênero e número, em alguns casos; pronome, com pessoa, gênero, número e caso; e verbo, com pessoa, número, tempo, modo e voz. Quatro classes são invariáveis, têm sempre a mesma forma: advérbio, preposição, conjunção e interjeição. Uma observação: o advérbio é, em regra, invariável, mas admite grau em alguns casos: cedo, cedinho, mais cedo, cedíssimo. Isso não o torna variável em gênero e número."}, {"type": "std", "h": "Quadro-resumo das 10 classes", "num": "", "c": "#7aa2ff", "d": null, "cards": [["1. Substantivo", "nomeia seres, lugares, coisas, sentimentos, ações, ideias: menina, Recife, saudade, corrida"], ["2. Artigo", "determina o substantivo: o, a, os, as, um, uma, uns, umas"], ["3. Adjetivo", "atribui qualidade, estado ou característica: bonito, cansada, brasileiro"], ["4. Numeral", "quantidade, ordem, múltiplo ou fração: três, terceiro, dobro, um terço"], ["5. Pronome", "substitui ou acompanha o substantivo, marcando a pessoa do discurso: eu, meu, este, alguém, que"], ["6. Verbo", "ação, estado, fenômeno; flexiona em pessoa, número, tempo, modo e voz: estudar, ser, chover"], ["7. Advérbio", "modifica verbo, adjetivo ou outro advérbio, dando circunstância: hoje, aqui, muito, bem, não"], ["8. Preposição", "liga dois termos, subordinando o segundo ao primeiro: a, de, em, com, para, por"], ["9. Conjunção", "liga orações ou termos de mesma função: e, mas, ou, porque, embora, se"], ["10. Interjeição", "exprime emoção ou apelo, de forma independente: ai!, oba!, psiu!, nossa!"]], "ex": [], "att": null, "t": "Resumindo o quadro das dez classes. Substantivo nomeia seres, lugares, coisas, sentimentos, ações e ideias. Artigo determina o substantivo. Adjetivo atribui qualidade, estado ou característica ao substantivo. Numeral indica quantidade, ordem, múltiplo ou fração. Pronome substitui ou acompanha o substantivo, marcando a pessoa do discurso. Verbo indica ação, estado, fenômeno, e flexiona em pessoa, número, tempo, modo e voz. Advérbio modifica verbo, adjetivo ou outro advérbio, dando circunstância. Preposição liga dois termos, subordinando o segundo ao primeiro. Conjunção liga orações ou termos de mesma função. E interjeição exprime emoção ou apelo, de forma independente."}, {"type": "std", "h": "Substantivo", "num": "1", "c": "#4aa3ff", "d": "Dá nome a seres, lugares, coisas, sentimentos, ações e ideias.", "cards": [["Extensão", "Comum (cidade, rio, menina) / Próprio (Recife, Amazonas, Ana)"], ["Existência", "Concreto (pedra, ar, fada, anjo) / Abstrato (beleza, trabalho, tristeza, viagem)"], ["Formação", "Simples (pedra) / Composto (guarda-chuva, couve-flor, passatempo)"], ["Origem", "Primitivo (flor, pedra) / Derivado (florista, pedreiro)"], ["Conjunto", "Coletivo: cardume (peixes), alcateia (lobos), enxame (abelhas)"], ["Flexões", "gênero, número e grau"]], "ex": [["A *professora* corrigiu as *provas*.", "professora: substantivo comum, concreto, biforme (feminino), núcleo do sujeito. provas: substantivo comum, plural, núcleo do objeto direto."], ["A *saudade* apertou no fim da tarde.", "saudade: substantivo abstrato, pois nomeia um sentimento que só existe em alguém."]], "att": "Teste do artigo: se dá para colocar o, a, um, uma antes da palavra, ela funciona como substantivo: a chuva, um sonho, o medo.", "t": "Substantivo dá nome a seres, lugares, coisas, sentimentos, ações e ideias. Na frase, é o núcleo dos termos principais: sujeito, objetos e complementos. Quanto à extensão, é comum, como cidade, rio, menina; ou próprio, como Recife, Amazonas, Ana, que leva inicial maiúscula. Quanto à existência, é concreto, como pedra e ar; ou abstrato, como beleza, trabalho, tristeza, que nomeia ações, estados, qualidades e sentimentos. Pode ser simples, como pedra, ou composto, como guarda-chuva; primitivo, como flor, ou derivado, como florista. E há o coletivo, que no singular designa um conjunto: cardume, alcateia, enxame. O substantivo flexiona em gênero, número e grau. Veja: em «A professora corrigiu as provas», professora é substantivo comum, concreto, biforme, núcleo do sujeito; provas é substantivo comum, plural, núcleo do objeto direto. Em «A saudade apertou no fim da tarde», saudade é abstrato, pois nomeia um sentimento que só existe em alguém. E uma dica de estudo, o teste do artigo: se você consegue colocar o, a, um, uma antes da palavra e a expressão faz sentido, ela funciona como substantivo: a chuva, um sonho, o medo."}, {"type": "std", "h": "Artigo", "num": "2", "c": "#2dd4bf", "d": "Determina o substantivo, indicando se ele é conhecido ou não.", "cards": [["Definido", "o, a, os, as: ser específico, conhecido, já mencionado ou único"], ["Indefinido", "um, uma, uns, umas: ser não identificado, apresentado como novidade"], ["Concordância", "sempre em gênero e número com o substantivo"], ["Contrações (artigo + preposição)", "a + o = ao; de + a = da; em + o = no; por + a = pela; em + um = num"]], "ex": [["Procuro *um* apartamento. / Procuro *o* apartamento.", "Na 1.ª, qualquer apartamento serve (indefinido). Na 2.ª, é um apartamento conhecido (definido). O artigo muda o sentido da frase."], ["*O* aluno entregou *a* prova.", "o e a: artigos definidos; concordam com aluno (masc. sing.) e prova (fem. sing.)."]], "att": "«A» pode ser artigo, preposição ou pronome. Em «Entreguei a carta a ela», o 1.º a é artigo e o 2.º é preposição.", "t": "Artigo é a palavra que antecede o substantivo para determiná-lo, ou seja, dizer se o ser de que falamos é específico, já conhecido de quem fala e de quem ouve, ou genérico, apresentado pela primeira vez. Concorda sempre em gênero e número com o substantivo. O definido é o, a, os, as: indica ser específico, conhecido, já mencionado ou único. O indefinido é um, uma, uns, umas: ser não identificado, apresentado como novidade. O artigo também se combina com preposições, formando ao, do, na, pelo, num: cada uma dessas palavras reúne duas classes, preposição mais artigo. Compare: «Procuro um apartamento» e «Procuro o apartamento». Na primeira, qualquer apartamento serve, é indefinido. Na segunda, é um apartamento conhecido, definido. O artigo muda o sentido da frase. Em «O aluno entregou a prova», o e a são artigos definidos e concordam com aluno e prova. Atenção: o «a» pode ser artigo, preposição ou pronome. Em «Entreguei a carta a ela», o primeiro a é artigo e o segundo é preposição."}, {"type": "std", "h": "Adjetivo", "num": "3", "c": "#4ade80", "d": "Atribui qualidades, estados e características ao substantivo.", "cards": [["Concordância", "em gênero e número com o substantivo"], ["Classificações", "simples (azul) e composto (verde-claro); primitivo (triste) e derivado (tristonho); pátrio (brasileiro, paulista); locução adjetiva (de ouro = áureo)"], ["Grau", "comparativo: mais alta do que, menos alta do que, tão alta quanto. Superlativo: a mais alta da turma, muito alta, altíssima"], ["Formas irregulares", "bom → melhor → ótimo; mau → pior → péssimo; grande → maior → máximo; pequeno → menor → mínimo"], ["Posição", "um homem pobre (sem dinheiro) / um pobre homem (digno de pena)"]], "ex": [["As crianças ficaram *cansadas*.", "cansadas: adjetivo que indica estado; ligado ao sujeito por ficaram (verbo de ligação). Função: predicativo do sujeito."], ["É um bom aluno, mas o irmão é *melhor*.", "melhor é o comparativo sintético de bom. Não se diz «mais bom»."]], "att": "Adjetivo ou advérbio? «Elas são altas» (adjetivo; varia). «Elas falaram alto» (advérbio de modo; não varia).", "t": "Adjetivo é a palavra que modifica o substantivo, atribuindo-lhe qualidade, característica, estado, origem ou aspecto. Concorda em gênero e número com o substantivo. Pode acompanhá-lo diretamente, menina inteligente, ou ser ligado a ele por um verbo de ligação: a menina é inteligente. Pode ser simples, azul, ou composto, verde-claro; primitivo, triste, ou derivado, tristonho; pátrio ou gentílico, como brasileiro e paulista. A locução adjetiva é preposição mais substantivo equivalendo a um adjetivo: de ouro é áureo. No grau, temos o comparativo: Ana é mais alta do que Bia; e o superlativo: a mais alta da turma, muito alta, altíssima. Formas irregulares: bom, melhor, ótimo; mau, pior, péssimo; grande, maior, máximo; pequeno, menor, mínimo. Por isso se diz melhor do que, e não mais bom do que. E a posição pode mudar o sentido: um homem pobre é sem dinheiro; um pobre homem é digno de pena. Em «As crianças ficaram cansadas», cansadas é adjetivo que indica estado, ligado ao sujeito por ficaram, verbo de ligação: predicativo do sujeito. Atenção: «Elas são altas», adjetivo, varia; «Elas falaram alto», advérbio de modo, não varia."}, {"type": "std", "h": "Numeral", "num": "4", "c": "#facc15", "d": "Indica quantidade, ordem, multiplicação ou fração.", "cards": [["Cardinal", "quantidade: um, dois, três, dez, vinte, cem, mil, milhão"], ["Ordinal", "ordem, posição: primeiro, segundo, terceiro, décimo"], ["Multiplicativo", "dobro, duplo, triplo, quádruplo, décuplo"], ["Fracionário", "meio, terço, quarto, quinto, dois terços, três oitavos"], ["Na frase", "função adjetiva («três livros») ou substantiva («os três chegaram»)"]], "ex": [["*Dois* *terços* da turma foram aprovados.", "dois: cardinal; terços: fracionário (plural). Juntos indicam a fração 2/3."], ["Esperei *meia* hora.", "meia: numeral fracionário (= metade de uma hora), concorda com hora (feminino)."]], "att": "«Meio»: em «meio litro», numeral fracionário; em «Ela está meio cansada», advérbio (= um pouco) e não varia.", "t": "Numeral é a palavra que exprime quantidade exata de seres, a posição que ocupam numa sequência, ou ainda multiplicação e divisão de quantidades. O cardinal indica quantidade: um, dois, três, dez, vinte, cem, mil. O ordinal indica ordem: primeiro, segundo, terceiro, décimo. O multiplicativo: dobro, duplo, triplo. E o fracionário: meio, terço, quarto, dois terços, três oitavos. O numeral pode funcionar como adjetivo, acompanhando um substantivo: três livros; ou como substantivo: os três chegaram. Veja: em «Dois terços da turma foram aprovados», dois é cardinal, terços é fracionário, no plural; juntos indicam a fração dois terços. Em «Esperei meia hora», meia é numeral fracionário, igual a metade de uma hora, e concorda com hora. Atenção ao «meio»: em meio litro, é numeral fracionário; em «Ela está meio cansada», é advérbio, igual a um pouco, e não varia."}, {"type": "std", "h": "Pronome", "num": "5", "c": "#c084fc", "d": "Substitui ou acompanha o substantivo, marcando as pessoas do discurso.", "cards": [["Pessoais", "reto (eu, tu, ele...), oblíquo átono (me, te, o, a, lhe...), oblíquo tônico (mim, ti, ele...)"], ["Tratamento", "você, o senhor, Vossa Excelência: levam o verbo na 3.ª pessoa"], ["Possessivos", "meu, teu, seu, nosso...: concordam com a coisa possuída"], ["Demonstrativos", "este (perto de quem fala), esse (perto de quem ouve), aquele (longe de ambos)"], ["Indefinidos", "alguém, ninguém, algo, tudo, nada; cada, certo, qualquer"], ["Interrogativos / Relativos", "que, quem, qual, quanto / que, quem, o qual, cujo, onde"]], "ex": [["*Eu* *te* avisei.", "eu: pronome pessoal reto (sujeito, 1.ª pessoa). te: pronome pessoal oblíquo átono (objeto direto, 2.ª pessoa)."], ["O professor *a quem* escrevi respondeu.", "a quem: pronome relativo (preposição a + quem); retoma professor (antecedente)."]], "att": "«Entre mim e você» é o correto; «entre eu e você» é erro.", "t": "Pronome é a palavra que substitui o substantivo ou o acompanha, determinando-o, em geral indicando uma das três pessoas do discurso: a primeira, quem fala; a segunda, com quem se fala; a terceira, de quem ou de que se fala. Temos os pronomes pessoais: o reto faz o papel de sujeito, como eu; o oblíquo átono funciona como complemento do verbo, como me, te, o, a, lhe; e o oblíquo tônico vem sempre depois de preposição: para mim, sem ti. Os pronomes de tratamento, como você e Vossa Excelência, levam o verbo na terceira pessoa. Os possessivos concordam com a coisa possuída. Os demonstrativos: este, perto de quem fala; esse, perto de quem ouve; aquele, longe de ambos. Os indefinidos: alguém, ninguém, algo, tudo, nada. Os interrogativos: que, quem, qual, quanto. E os relativos: que, quem, o qual, cujo, onde. Em «Eu te avisei», eu é pronome pessoal reto, sujeito, primeira pessoa; te é oblíquo átono, objeto direto, segunda pessoa. Em «O professor a quem escrevi respondeu», a quem é pronome relativo, retoma professor, o antecedente. E o cuidado clássico: «Entre mim e você» é o correto; «entre eu e você» é erro."}, {"type": "std", "h": "Verbo", "num": "6", "c": "#ff8a65", "d": "Indica ação, estado, fenômeno da natureza ou ocorrência, situados no tempo.", "cards": [["Conjugações", "1.ª em -ar (cantar); 2.ª em -er (vender); 3.ª em -ir (partir)"], ["Modos", "Indicativo (certeza), Subjuntivo (dúvida, possibilidade, desejo, hipótese), Imperativo (ordem, pedido, conselho)"], ["Formas nominais", "infinitivo (estudar), gerúndio (estudando), particípio (estudado)"], ["Classificação", "regular, irregular, defectivo, abundante, auxiliar, impessoal"], ["Vozes", "ativa, passiva, reflexiva"], ["Locução verbal", "auxiliar + verbo principal numa forma nominal: «Ela está estudando»"]], "ex": [["*Choveu* a noite toda.", "choveu: verbo impessoal (fenômeno da natureza); não tem sujeito e fica na 3.ª pessoa do singular."], ["Ela *tem estudado* bastante.", "tem estudado: locução verbal (auxiliar ter + particípio). Indica ação que se repete até o presente."]], "att": "Verbo ou substantivo? «Eu estudo à noite» (verbo, conjugado). «O estudo é longo» (substantivo, tem artigo).", "t": "Verbo é a palavra que exprime ação, estado, mudança de estado, fenômeno da natureza ou ocorrência. É a única classe que se conjuga, isto é, que flexiona em pessoa, número, tempo, modo e voz. Na oração, é o núcleo do predicado. As três conjugações são definidas pelo infinitivo: a primeira em -ar, como cantar; a segunda em -er, como vender; a terceira em -ir, como partir. Os modos: o indicativo expressa certeza, fato real; o subjuntivo, dúvida, possibilidade, desejo, hipótese; o imperativo, ordem, pedido, conselho. As formas nominais são infinitivo, gerúndio e particípio: estudar, estudando, estudado. Quanto à classificação, o verbo pode ser regular, irregular, defectivo, abundante, auxiliar ou impessoal. E tem as vozes: ativa, passiva e reflexiva. Locução verbal é um verbo auxiliar mais o verbo principal numa forma nominal: «Ela está estudando». Em «Choveu a noite toda», choveu é verbo impessoal: não tem sujeito e fica na terceira pessoa do singular. Em «Ela tem estudado bastante», tem estudado é locução verbal, auxiliar ter mais particípio. Atenção: «Eu estudo à noite» é verbo; «O estudo é longo» é substantivo."}, {"type": "std", "h": "Advérbio", "num": "7", "c": "#fb923c", "d": "Modifica verbo, adjetivo ou outro advérbio, indicando uma circunstância.", "cards": [["Lugar", "aqui, ali, lá, perto, longe"], ["Tempo", "hoje, ontem, amanhã, agora, já, sempre, nunca, cedo"], ["Modo", "bem, mal, assim, depressa, devagar, calmamente"], ["Intensidade", "muito, pouco, bastante, demais, mais, menos"], ["Afirmação / Negação", "sim, certamente / não, nunca, jamais"], ["Dúvida", "talvez, possivelmente, provavelmente"]], "ex": [["Ela é *muito* simpática.", "muito: advérbio de intensidade; modifica o adjetivo simpática. Como modifica adjetivo, não varia."], ["Ele falou *muito* *bem*.", "muito: intensidade, modifica o advérbio bem. bem: advérbio de modo, modifica o verbo falou."]], "att": "Mau × mal. Mau é adjetivo (um mau aluno). Mal é advérbio (Ele se comportou mal).", "t": "Advérbio é a palavra invariável que modifica um verbo, como em «Ela chegou cedo»; um adjetivo, «Ele é muito simpático»; ou outro advérbio, «Chegou muito cedo», indicando uma circunstância. Os tipos: lugar, como aqui e ali; tempo, como hoje, ontem, sempre; modo, como bem, mal, depressa, e a maioria dos terminados em -mente; intensidade, como muito, pouco, demais; afirmação, como sim e certamente; negação, como não, nunca, jamais; e dúvida, como talvez e provavelmente. Locução adverbial é um conjunto de palavras com valor de advérbio: à noite, de repente. Em «Ela é muito simpática», muito é advérbio de intensidade, modifica o adjetivo simpática; como modifica adjetivo, não varia. Em «Ele falou muito bem», muito modifica o advérbio bem, e bem é advérbio de modo, modifica o verbo falou. Atenção: mau é adjetivo, um mau aluno; mal é advérbio, «Ele se comportou mal»."}, {"type": "std", "h": "Preposição", "num": "8", "c": "#f472b6", "d": "Liga dois termos, subordinando o segundo ao primeiro.", "cards": [["Essenciais", "a, ante, após, até, com, contra, de, desde, em, entre, para, perante, por, sem, sob, sobre, trás"], ["Acidentais", "conforme, durante, exceto, mediante, salvo, segundo, como"], ["Locução prepositiva", "termina sempre por preposição: antes de, apesar de, por causa de"], ["Relações de sentido", "lugar, tempo, finalidade, causa, meio, companhia, matéria, posse, assunto, oposição"], ["Contração", "de + o = do; em + a = na; por + o = pelo; a + a = à (crase)"]], "ex": [["Preciso *de* ajuda *para* terminar.", "de: exigida pelo verbo precisar (regência). para: finalidade; liga ajuda a terminar."], ["Voltei *do* trabalho *à* noite.", "do: contração de de + o (lugar de origem). à: preposição a + artigo a em locução adverbial de tempo."]], "att": "Não use crase antes de verbo: «Começou a chover».", "t": "Preposição é a palavra invariável que liga dois termos da oração, estabelecendo entre eles uma relação de dependência: o termo que vem depois, o regido, completa ou especifica o que vem antes, o regente. Em «Gosto de música», a preposição liga o verbo gosto ao seu complemento música. As essenciais só funcionam como preposição: a, ante, após, até, com, contra, de, desde, em, entre, para, perante, por, sem, sob, sobre, trás. As acidentais são palavras de outras classes que, em certos contextos, funcionam como preposições: conforme, durante, exceto, segundo. E a locução prepositiva termina sempre por preposição: antes de, apesar de. A preposição expressa relações de lugar, tempo, finalidade, causa, meio, companhia, matéria, posse, assunto, oposição. Em «Preciso de ajuda para terminar», de é exigida pelo verbo precisar, é a regência; para indica finalidade. Em «Voltei do trabalho à noite», do é contração de de mais o, e à é a preposição a mais o artigo a. Atenção: não use crase antes de verbo: «Começou a chover»."}, {"type": "std", "h": "Conjunção", "num": "9", "c": "#38bdf8", "d": "Liga orações ou termos de mesma função, expressando relações de sentido.", "cards": [["Coordenativas", "aditiva (e, nem), adversativa (mas, porém), alternativa (ou, ora... ora), conclusiva (logo, portanto), explicativa (que, porque, pois)"], ["Subordinativas", "integrante (que, se), causal, comparativa, concessiva (embora), condicional (se, caso), conformativa, consecutiva, final (para que), proporcional, temporal (quando)"], ["Locução conjuntiva", "termina por que: ainda que, desde que, para que"]], "ex": [["Quis sair, *mas* chovia muito.", "mas: coordenativa adversativa; a segunda oração se opõe à primeira."], ["*Embora* estivesse cansado, ele ajudou a mãe.", "embora: subordinativa concessiva; expressa um obstáculo que não impediu a ação principal."]], "att": "«Pois»: antes do verbo, é explicativa; depois do verbo, é conclusiva.", "t": "Conjunção é a palavra invariável que liga orações ou termos de mesma função dentro de uma oração. Pode somar informações, opô-las, indicar causa, condição e assim por diante. Locução conjuntiva é o grupo de palavras que termina por que: ainda que, desde que, para que. Há dois grandes grupos. As coordenativas ligam elementos independentes: aditiva, como e e nem; adversativa, como mas e porém; alternativa, como ou e ora... ora; conclusiva, como logo e portanto; e explicativa, como porque e pois. As subordinativas ligam uma oração a outra da qual ela depende: integrante, causal, comparativa, concessiva, condicional, conformativa, consecutiva, final, proporcional e temporal. Em «Quis sair, mas chovia muito», mas é coordenativa adversativa: a segunda oração se opõe à primeira. Em «Embora estivesse cansado, ele ajudou a mãe», embora é subordinativa concessiva: expressa um obstáculo que não impediu a ação principal. Atenção: o «pois», antes do verbo, é explicativa; depois do verbo, é conclusiva."}, {"type": "std", "h": "Interjeição", "num": "10", "c": "#fde047", "d": "Exprime emoções, sensações ou apelos, de forma independente.", "cards": [["Alegria, satisfação", "oba! eba! viva! uhu!"], ["Dor, tristeza", "ai! ui! ah!"], ["Surpresa, espanto", "nossa! uau! puxa! ué!"], ["Medo, susto", "credo! cruzes! socorro!"], ["Alívio", "ufa!"], ["Silêncio", "psiu! silêncio!"], ["Locução interjetiva", "Meu Deus! Ai de mim! Puxa vida!"]], "ex": [["*Ufa*! Consegui terminar.", "ufa: interjeição de alívio. Está isolada pelo ponto de exclamação e não se liga ao verbo."], ["*Nossa*! Que susto eu levei!", "nossa: interjeição de espanto. Não confundir com o pronome possessivo nossa («nossa casa»)."]], "att": "Interjeição ≠ onomatopeia (tic-tac, pum). Interjeição ≠ vocativo: «Pedro, venha cá!» (Pedro é substantivo); «Ei, venha cá!» (ei é interjeição).", "t": "Interjeição é a palavra ou expressão invariável que exprime emoção, sensação, estado de espírito ou um apelo. Tem independência sintática: não se liga a nenhum termo da oração e equivale a uma frase completa, como «Ai!» e «Nossa!». Exprime alegria: oba, eba, viva; dor: ai, ui; surpresa: nossa, uau, puxa, ué; medo: credo, cruzes, socorro; alívio: ufa; silêncio: psiu. E há locuções interjetivas, como Meu Deus e Ai de mim. Em «Ufa! Consegui terminar», ufa é interjeição de alívio: está isolada pelo ponto de exclamação e não se liga ao verbo. Em «Nossa! Que susto eu levei!», nossa é interjeição de espanto; não confunda com o pronome possessivo nossa, de «nossa casa». Atenção: interjeição não é onomatopeia, que imita sons, como tic-tac e pum. E não é vocativo: em «Pedro, venha cá!», Pedro é substantivo; em «Ei, venha cá!», ei é interjeição."}, {"type": "rows", "h": "Uma mesma palavra, várias classes", "num": "", "c": "#7aa2ff", "cols": ["Palavra", "Na frase", "Classe"], "ci": 2, "rows": [["que", "O livro *que* li foi ótimo.", "pronome relativo"], ["que", "*Que* horas são?", "pronome interrogativo"], ["que", "Penso *que* ele chegou.", "conjunção integrante"], ["que", "É mais alto *que* eu.", "conjunção comparativa"], ["que", "Venha, *que* o jantar esfria.", "conjunção explicativa"], ["a", "*A* casa é grande.", "artigo"], ["a", "Vou *a* Recife.", "preposição"], ["a", "Vi-*a* na praça.", "pronome pessoal oblíquo"]], "s": null, "t": "Como vimos, a classe de uma palavra depende do contexto. Veja o que, que gera mais dúvidas. Em «O livro que li foi ótimo», pronome relativo. Em «Que horas são?», pronome interrogativo. Em «Penso que ele chegou», conjunção integrante. Em «É mais alto que eu», conjunção comparativa. E em «Venha, que o jantar esfria», conjunção explicativa. O mesmo vale para o a: em «A casa é grande», artigo; em «Vou a Recife», preposição; em «Vi-a na praça», pronome pessoal oblíquo. Por isso, nunca classifique a palavra solta."}, {"type": "rows", "h": "Roteiro de identificação", "num": "", "c": "#7aa2ff", "cols": ["Passo", "Pergunta-teste", "Se sim, é..."], "ci": 2, "rows": [["1", "A palavra pode ser conjugada? Indica ação, estado ou fenômeno?", "verbo"], ["2", "Nomeia algo e aceita artigo antes (o, a, um, uma)?", "substantivo"], ["3", "É um o, a, os, as, um, uma... colado ao substantivo?", "artigo"], ["4", "Qualifica um substantivo e concorda com ele?", "adjetivo"], ["5", "Indica quantidade exata, ordem, múltiplo ou fração?", "numeral"], ["6", "Substitui um nome ou o acompanha (pessoa, posse, posição, indefinição)?", "pronome"], ["7", "Não varia e modifica verbo, adjetivo ou outro advérbio?", "advérbio"], ["8", "Liga dois termos e o segundo depende do primeiro?", "preposição"], ["9", "Liga orações e expressa soma, oposição, causa, condição, tempo?", "conjunção"], ["10", "Exprime emoção ou apelo e fica isolada?", "interjeição"]], "s": null, "t": "Como descobrir a classe? Aplique as perguntas sempre em relação à frase em que a palavra aparece; a primeira resposta afirmativa quase sempre resolve. Passo um: a palavra pode ser conjugada? Indica ação, estado ou fenômeno? Verbo. Dois: nomeia algo e aceita artigo antes? Substantivo. Três: é um o, a, um, uma, colado ao substantivo? Artigo. Quatro: qualifica um substantivo e concorda com ele? Adjetivo. Cinco: indica quantidade exata, ordem, múltiplo ou fração? Numeral. Seis: substitui um nome ou o acompanha, indicando pessoa, posse, posição ou indefinição? Pronome. Sete: não varia e modifica verbo, adjetivo ou outro advérbio? Advérbio. Oito: liga dois termos e o segundo depende do primeiro? Preposição. Nove: liga orações e expressa soma, oposição, causa, condição, tempo? Conjunção. Dez: exprime emoção ou apelo e fica isolada? Interjeição. E uma dica de estudo: em frases com muitas palavras, comece pelo verbo. Depois identifique os substantivos e, em volta deles, os artigos, adjetivos, numerais e pronomes. O que sobrar costuma ser advérbio, preposição ou conjunção."}, {"type": "rows", "h": "Análise passo a passo", "num": "", "c": "#7aa2ff", "cols": ["Palavra", "Classe", "Justificativa"], "ci": 1, "rows": [["Ontem", "advérbio de tempo", "modifica o verbo; indica quando"], ["a", "artigo definido", "acompanha vizinha"], ["minha", "pronome possessivo (adjetivo)", "indica posse; concorda com vizinha"], ["vizinha", "substantivo comum, concreto", "núcleo do sujeito"], ["comprou", "verbo", "indicativo, pretérito perfeito, 3.ª sing."], ["três", "numeral cardinal", "indica quantidade; acompanha pães"], ["pães", "substantivo comum", "plural de pão (-ães)"], ["quentes", "adjetivo", "qualifica pães; concorda em número"], ["e", "conjunção coordenativa aditiva", "liga as duas orações"], ["saiu", "verbo", "indicativo, pretérito perfeito, 3.ª sing."], ["rapidamente", "advérbio de modo", "modifica saiu; termina em -mente"]], "s": "Ontem, a minha vizinha comprou três pães quentes e saiu rapidamente.", "t": "Vamos analisar uma frase palavra por palavra: «Ontem, a minha vizinha comprou três pães quentes e saiu rapidamente.» Ontem: advérbio de tempo, modifica o verbo, indica quando. A: artigo definido, acompanha vizinha. Minha: pronome possessivo, indica posse e concorda com vizinha. Vizinha: substantivo comum, concreto, núcleo do sujeito. Comprou: verbo, indicativo, pretérito perfeito, terceira pessoa do singular. Três: numeral cardinal, indica quantidade, acompanha pães. Pães: substantivo comum, plural de pão. Quentes: adjetivo, qualifica pães e concorda em número. E: conjunção coordenativa aditiva, liga as duas orações. Saiu: verbo, indicativo, pretérito perfeito, terceira pessoa do singular. E rapidamente: advérbio de modo, modifica saiu e termina em -mente."}, {"type": "rows", "h": "Exercício 3 · a palavra «que»", "num": "", "c": "#ffd166", "cols": ["Frase", "Classe", "Por quê"], "ci": 1, "rows": [["a) O filme *que* vimos ontem foi ótimo.", "pronome relativo", "retoma filme (= o qual)"], ["b) Penso *que* ele já chegou.", "conjunção subordinativa integrante", "introduz a oração que completa penso"], ["c) *Que* horas são?", "pronome interrogativo", "pergunta pelas horas"], ["d) Ele é mais alto *que* eu.", "conjunção subordinativa comparativa", "compara com mais alto"], ["e) Venha logo, *que* o jantar esfria.", "conjunção coordenativa explicativa", "(= pois): justifica a ordem venha logo"]], "s": null, "t": "Exercício 3. Classifique a palavra que em cada frase. A) «O filme que vimos ontem foi ótimo»: pronome relativo; retoma filme, e dá para trocar por o qual. B) «Penso que ele já chegou»: conjunção subordinativa integrante; introduz a oração que completa penso. C) «Que horas são?»: pronome interrogativo; pergunta pelas horas. D) «Ele é mais alto que eu»: conjunção subordinativa comparativa; compara com mais alto. E) «Venha logo, que o jantar esfria»: conjunção coordenativa explicativa, igual a pois; justifica a ordem venha logo. Dica do gabarito: se for possível trocar que por o qual, é pronome relativo. Se introduz oração que completa o verbo e não pode ser trocado por o qual, é conjunção integrante."}, {"type": "rows", "h": "Exercício 4 · cada «a» e a palavra «ela»", "num": "", "c": "#ffd166", "cols": ["Palavra", "Classe", "Por quê"], "ci": 1, "rows": [["A (professora)", "artigo definido", "acompanha professora", 0], ["a (prova)", "artigo definido", "acompanha prova", 3], ["a (ela)", "preposição", "liga entregou a ela", 5], ["ela", "pronome pessoal", "form
